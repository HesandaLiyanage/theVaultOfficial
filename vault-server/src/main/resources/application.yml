spring:
  application:
    name: theVault
  datasource:
    url: jdbc:postgresql://${VAULT_DB_HOST:localhost}:${VAULT_DB_PORT:5433}/${VAULT_DB_NAME:vault_db}
    username: vault
    password: vault
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: validate   # Flyway manages schema, not Hibernate
    show-sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

vault:
  sdk:
    enabled: false
  internal-service-key: ${VAULT_INTERNAL_SERVICE_KEY:change-me-in-production}
  api-keys:
    rate-limit:
      limit: ${VAULT_API_KEY_RATE_LIMIT:100}
      window-seconds: ${VAULT_API_KEY_RATE_LIMIT_WINDOW_SECONDS:60}

jwt:
  # v0.2.0 generates a fresh RSA-2048 keypair at startup. Persistent keys
  # land in v0.2.1; until then a server restart invalidates all tokens.
  expiration-ms: 900000          # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

server:
  port: ${SERVER_PORT:8081}
