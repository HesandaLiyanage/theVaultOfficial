spring:
  application:
    name: demo-service
  datasource:
    url: jdbc:postgresql://${DEMO_DB_HOST:localhost}:${DEMO_DB_PORT:5433}/${DEMO_DB_NAME:vault_demo_db}
    username: ${DEMO_DB_USER:vault}
    password: ${DEMO_DB_PASSWORD:vault}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/migration/vault

server:
  port: ${DEMO_SERVER_PORT:9090}

vault:
  jwt:
    secret: ${VAULT_JWT_SECRET:change-me-change-me-change-me-change}
  public-paths:
    - /auth/**
    - /public/**
    - /actuator/health
    - /users/register
